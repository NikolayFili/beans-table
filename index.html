<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#B5552F" />
  <meta name="description" content="A quiet cookbook for cooking one nice dish a week for Bean." />
  <title>Bean's Table</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1 class="wordmark">Bean&rsquo;s Table</h1>
        <span class="brand-sub">Bean &amp; Boyfriend</span>
      </div>
      <button class="icon-btn" id="menuBtn" aria-label="Settings" title="Settings">&#9881;</button>
    </div>
  </header>

  <main id="app" class="app"><!-- views render here --></main>

  <nav class="tabbar" aria-label="Primary">
    <button class="tab" data-tab="library" aria-current="page">
      <span class="tab-ico">&#9737;</span><span class="tab-label">Dishes</span>
    </button>
    <button class="tab" data-tab="week">
      <span class="tab-ico">&#9711;</span><span class="tab-label">Schedule</span>
    </button>
    <button class="tab" data-tab="list">
      <span class="tab-ico">&#10003;</span><span class="tab-label">Shopping</span>
    </button>
  </nav>

  <!-- Overlay host for dish editor / detail / settings -->
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" id="sheet"><!-- content --></div>
  </div>

  <!-- Hidden file input for JSON import -->
  <input type="file" id="importFile" accept="application/json,.json" hidden />

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script src="sync.js"></script>
</body>
</html>
